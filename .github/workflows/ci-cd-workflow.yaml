name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ilyasjaelani

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      
    outputs:
      short-sha: ${{ steps.vars.outputs.short-sha }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up variables
        id: vars
        run: |
          echo "short-sha=$(echo ${{ github.sha }} | cut -c1-7)" >> $GITHUB_OUTPUT
          echo "date=$(date +'%Y%m%d-%H%M%S')" >> $GITHUB_OUTPUT

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Build and Push Frontend
      - name: Extract metadata for Frontend
        id: meta-frontend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/simple-loginapp-frontend
          tags: |
            type=sha,prefix=,format=short
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch

      - name: Build and push Frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Build and Push Backend
      - name: Extract metadata for Backend
        id: meta-backend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/simple-loginapp-backend
          tags: |
            type=sha,prefix=,format=short
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch

      - name: Build and push Backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Image digest
        run: |
          echo "✅ Images built and pushed successfully!"
          echo "Frontend: ${{ steps.meta-frontend.outputs.tags }}"
          echo "Backend: ${{ steps.meta-backend.outputs.tags }}"

  update-gitops:
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    
    steps:
      - name: Checkout GitOps repository
        uses: actions/checkout@v4
        with:
          repository: ilyasjaelani/simple-loginapp-gitops
          token: ${{ secrets.GITOPS_PAT }}
          ref: main

      - name: Update image tags in manifests
        run: |
          SHORT_SHA=${{ needs.build-and-push.outputs.short-sha }}
          
          echo "Updating image tags to: ${SHORT_SHA}"
          
          # Update frontend image tag
          sed -i "s|image: ghcr.io/ilyasjaelani/simple-loginapp-frontend:.*|image: ghcr.io/ilyasjaelani/simple-loginapp-frontend:${SHORT_SHA}|g" apps/simple-loginapp/frontend.yaml
          
          # Update backend image tag
          sed -i "s|image: ghcr.io/ilyasjaelani/simple-loginapp-backend:.*|image: ghcr.io/ilyasjaelani/simple-loginapp-backend:${SHORT_SHA}|g" apps/simple-loginapp/backend.yaml
          
          echo "✅ Updated image tags"
          
          # Show changes
          echo "=== Changes to frontend.yaml ==="
          grep "image: ghcr.io" apps/simple-loginapp/frontend.yaml
          
          echo "=== Changes to backend.yaml ==="
          grep "image: ghcr.io" apps/simple-loginapp/backend.yaml

      - name: Commit and push changes
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          git add apps/simple-loginapp/frontend.yaml apps/simple-loginapp/backend.yaml
          
          SHORT_SHA="${{ needs.build-and-push.outputs.short-sha }}"
          
          if git diff --staged --quiet; then
            echo "⚠️ No changes to commit"
          else
            git commit -m "$(printf '🚀 Update image tags to %s\n\nAutomated update by GitHub Actions\n- Frontend: ghcr.io/ilyasjaelani/simple-loginapp-frontend:%s\n- Backend: ghcr.io/ilyasjaelani/simple-loginapp-backend:%s' "${SHORT_SHA}" "${SHORT_SHA}" "${SHORT_SHA}")"
            
            git push
            echo "✅ Successfully pushed changes to GitOps repository"
          fi

  notify:
    needs: [build-and-push, update-gitops]
    runs-on: ubuntu-latest
    if: always()
    
    steps:
      - name: Pipeline Summary
        run: |
          echo "### 🚀 CI/CD Pipeline Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [ "${{ needs.build-and-push.result }}" == "success" ]; then
            echo "✅ **Build & Push**: Success" >> $GITHUB_STEP_SUMMARY
            echo "- Frontend image: \`ghcr.io/ilyasjaelani/simple-loginapp-frontend:${{ needs.build-and-push.outputs.short-sha }}\`" >> $GITHUB_STEP_SUMMARY
            echo "- Backend image: \`ghcr.io/ilyasjaelani/simple-loginapp-backend:${{ needs.build-and-push.outputs.short-sha }}\`" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **Build & Push**: Failed" >> $GITHUB_STEP_SUMMARY
          fi
          
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [ "${{ needs.update-gitops.result }}" == "success" ]; then
            echo "✅ **GitOps Update**: Success" >> $GITHUB_STEP_SUMMARY
            echo "- Repository: \`ilyasjaelani/simple-loginapp-gitops\`" >> $GITHUB_STEP_SUMMARY
            echo "- Updated files: \`frontend.yaml\`, \`backend.yaml\`" >> $GITHUB_STEP_SUMMARY
          elif [ "${{ needs.update-gitops.result }}" == "skipped" ]; then
            echo "⏭️ **GitOps Update**: Skipped (not main branch)" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **GitOps Update**: Failed" >> $GITHUB_STEP_SUMMARY
          fi
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "🔄 **Next Step**: ArgoCD will automatically sync the changes to Kubernetes cluster" >> $GITHUB_STEP_SUMMARY